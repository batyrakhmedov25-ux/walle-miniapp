<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Walle — Вынос мусора</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════
           БАЗОВЫЕ НАСТРОЙКИ (ЗАЩИТА ОТ БЕЛОГО ЭКРАНА)
        ═══════════════════════════════════════════════════════ */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000 !important; /* Фон всегда черный */
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════════════════════════════════════════════
           5 СЛОЕВ ЗВЕЗД (ЧИСТЫЙ CSS)
        ═══════════════════════════════════════════════════════ */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
            pointer-events: none;
        }

        .star-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            background: transparent;
            will-change: transform;
        }

        /* Генерация слоев (разные размеры и тени) */
        .l1 { box-shadow: 10vw 20vh #fff, 50vw 10vh #fff, 80vw 30vh #fff, 20vw 70vh #fff, 90vw 80vh #fff, 40vw 40vh #fff, 15vw 85vh #fff, 65vw 55vh #fff, 33vw 12vh #fff, 77vw 92vh #fff; animation: blink 4s infinite; }
        .l2 { width: 2px; height: 2px; box-shadow: 5vw 5vh #80aaff, 45vw 65vh #80aaff, 85vw 15vh #80aaff, 25vw 85vh #80aaff, 65vw 35vh #80aaff, 12vw 42vh #80aaff, 78vw 58vh #80aaff; animation: blink 7s infinite; }
        .l3 { box-shadow: 30vw 10vh #ffe0b3, 70vw 40vh #ffe0b3, 10vw 60vh #ffe0b3, 50vw 90vh #ffe0b3, 95vw 20vh #ffe0b3, 42vw 5vh #ffe0b3; animation: blink 5s infinite; opacity: 0.6; }
        .l4 { width: 1.5px; height: 1.5px; box-shadow: 15vw 35vh #fff, 60vw 75vh #fff, 85vw 95vh #fff, 5vw 15vh #fff, 40vw 60vh #fff; animation: blink 3s infinite; }
        .l5 { box-shadow: 22vw 88vh #fff, 38vw 12vh #fff, 66vw 44vh #fff, 88vw 22vh #fff, 11vw 33vh #fff; animation: blink 6s infinite; opacity: 0.4; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ═══════════════════════════════════════════════════════
           ФОТОРЕАЛИСТИЧНАЯ ЗЕМЛЯ (earth.jpg)
        ═══════════════════════════════════════════════════════ */
        .earth-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #earth-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.2); /* Атмосферное свечение */
            background: #000;
        }

        /* Сама картинка земли */
        #earth-container img {
            width: 200%; /* Запас для вращения */
            height: 100%;
            object-fit: cover;
            position: absolute;
            left: 0;
            animation: rotateEarth 40s linear infinite;
        }

        /* Эффект вечера (тень терминатора) */
        .terminator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, transparent 40%, rgba(0,0,0,0.9) 75%, #000 100%);
            z-index: 2;
        }

        @keyframes rotateEarth {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* ═══════════════════════════════════════════════════════
           ИНТЕРФЕЙС (GLASSMORPHISM)
        ═══════════════════════════════════════════════════════ */
        .app-container {
            position: relative;
            z-index: 50;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            isolation: isolate; /* Защита от пропадания в Telegram */
        }

        h1 { font-weight: 800; font-size: 28px; margin-bottom: 8px; }
        p { color: #94a3b8; line-height: 1.5; font-size: 15px; }

        .btn-primary {
            display: block;
            width: 100%;
            background: #22c55e;
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
            transition: transform 0.2s;
            isolation: isolate;
            z-index: 100;
        }

        .btn-secondary {
            display: block;
            width: 100%;
            background: rgba(255,255,255,0.05);
            color: #fff;
            text-decoration: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 600;
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            isolation: isolate;
            z-index: 100;
        }

        .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div class="stars-container">
        <div class="star-layer l1"></div>
        <div class="star-layer l2"></div>
        <div class="star-layer l3"></div>
        <div class="star-layer l4"></div>
        <div class="star-layer l5"></div>
    </div>

    <div class="app-container">
        <div class="earth-wrapper">
            <div id="earth-container">
                <img src="earth.jpg" alt="Earth" onerror="this.style.display='none'; alert('Файл earth.jpg не найден в папке!')">
                <div class="terminator"></div>
            </div>
        </div>

        <div class="glass-card">
            <h1>walle — вынос мусора</h1>
            <p>Ваш личный ассистент по чистоте. Мы заберем мусор прямо от вашей двери, пока вы отдыхаете.</p>
        </div>

        <a href="#" class="btn-primary">Попробовать за 1 ₽</a>
        <a href="#" class="btn-secondary">Как это работает?</a>
    </div>

    <script>
        // Безопасный запуск
        window.onload = function() {
            console.log("Приложение успешно запущено");
            // Сюда можно добавить логику переключения страниц, 
            // она не уронит интерфейс, так как стили уже загружены.
        };
    </script>
</body>
</html>
