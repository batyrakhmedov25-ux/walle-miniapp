<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Walle — Космический сервис</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════
           ОСНОВНЫЕ НАСТРОЙКИ И ФОН
        ═══════════════════════════════════════════════════════ */
        :root {
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.5);
            --glass: rgba(15, 23, 42, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a1122 0%, #000000 100%);
            color: #fff; font-family: 'Inter', sans-serif;
            overflow: hidden; isolation: isolate;
        }

        /* ═══════════════════════════════════════════════════════
           ЗВЕЗДНОЕ НЕБО (5 СЛОЕВ)
        ═══════════════════════════════════════════════════════ */
        .stars-container {
            position: fixed; inset: 0; z-index: -10; pointer-events: none;
        }

        .star-layer {
            position: absolute; top: 0; left: 0; width: 2px; height: 2px;
            background: transparent; will-change: transform;
        }

        /* Слои теней (координаты звезд) */
        .l1 { box-shadow: 10vw 20vh #fff, 50vw 10vh #fff, 80vw 30vh #fff, 20vw 70vh #fff, 90vw 80vh #fff, 40vw 40vh #fff; animation: blink 4s infinite; }
        .l2 { width: 1px; box-shadow: 5vw 5vh #80aaff, 45vw 65vh #80aaff, 85vw 15vh #80aaff, 25vw 85vh #80aaff, 65vw 35vh #80aaff; animation: blink 7s infinite; }
        .l3 { box-shadow: 30vw 10vh #ffe0b3, 70vw 40vh #ffe0b3, 10vw 60vh #ffe0b3, 50vw 90vh #ffe0b3, 95vw 20vh #ffe0b3; animation: blink 5s infinite; }
        .l4 { width: 3px; height: 3px; box-shadow: 15vw 35vh #fff, 60vw 75vh #fff, 85vw 95vh #fff, 5vw 15vh #fff; animation: blink 3s infinite; filter: blur(1px); }
        .l5 { box-shadow: 22vw 88vh #fff, 38vw 12vh #fff, 66vw 44vh #fff, 88vw 22vh #fff; animation: blink 6s infinite; opacity: 0.5; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ═══════════════════════════════════════════════════════
           КОМЕТЫ
        ═══════════════════════════════════════════════════════ */
        .comet {
            position: absolute; width: 2px; height: 2px;
            background: linear-gradient(to right, #fff, transparent);
            box-shadow: 0 0 10px #fff; border-radius: 50%;
            opacity: 0; z-index: -5; pointer-events: none;
        }

        @keyframes cometAnim {
            0% { transform: translateX(0) translateY(0) rotate(-45deg) scale(0); opacity: 0; }
            10% { opacity: 1; scale: 1; }
            100% { transform: translateX(-500px) translateY(500px) rotate(-45deg) scale(0); opacity: 0; }
        }

        /* ═══════════════════════════════════════════════════════
           ВЕЧЕРНЯЯ ЗЕМЛЯ (earth.jpg)
        ═══════════════════════════════════════════════════════ */
        .earth-scene {
            position: relative; width: 100%; height: 40vh;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .earth-sphere {
            position: relative; width: 280px; height: 280px;
            border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 60px rgba(100, 150, 255, 0.2);
            background: #000; transform: translateZ(0);
        }

        .earth-texture {
            width: 200%; height: 100%;
            background: url('earth.jpg') repeat-x;
            background-size: 50% 100%;
            position: absolute; animation: rotateMap 80s linear infinite;
        }

        .earth-shadow {
            position: absolute; inset: 0; z-index: 2;
            background: radial-gradient(circle at 30% 50%, transparent 35%, rgba(0,0,0,0.9) 70%, #000 100%);
        }

        .earth-glow {
            position: absolute; inset: -2px; border-radius: 50%; z-index: 3;
            box-shadow: inset 0 0 25px rgba(100, 150, 255, 0.3);
            border: 1.5px solid rgba(100, 150, 255, 0.2);
            pointer-events: none;
        }

        @keyframes rotateMap { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* Состояние для других страниц */
        body.inner-page .earth-scene { height: 15vh; transform: scale(0.5) translateY(-20px); opacity: 0.7; }

        /* ═══════════════════════════════════════════════════════
           ИНТЕРФЕЙС
        ═══════════════════════════════════════════════════════ */
        .app-container {
            position: relative; z-index: 100; padding: 0 20px 40px;
            max-width: 500px; margin: 0 auto;
        }

        .page { display: none; animation: fadeIn 0.5s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 28px;
            padding: 30px 24px; text-align: center;
        }

        h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px; letter-spacing: -1px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.5; margin: 0; }

        .btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 64px; border-radius: 20px;
            font-size: 17px; font-weight: 700; text-decoration: none;
            margin-top: 15px; transition: 0.2s; border: none; cursor: pointer;
        }

        .btn-primary { 
            background: var(--green); color: #062010; 
            box-shadow: 0 0 25px var(--green-glow);
        }

        .btn-secondary { 
            background: rgba(255,255,255,0.05); color: #fff; 
            border: 1px solid var(--border);
        }

        .btn:active { transform: scale(0.97); }

        /* Успех */
        .success-icon {
            width: 80px; height: 80px; background: var(--green);
            border-radius: 50%; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 20px var(--green); } 50% { box-shadow: 0 0 50px var(--green); } 100% { box-shadow: 0 0 20px var(--green); } }

    </style>
</head>
<body>

    <div class="stars-container">
        <div class="star-layer l1"></div>
        <div class="star-layer l2"></div>
        <div class="star-layer l3"></div>
        <div class="star-layer l4"></div>
        <div class="star-layer l5"></div>
    </div>

    <div class="earth-scene">
        <div class="earth-sphere">
            <div class="earth-texture"></div>
            <div class="earth-shadow"></div>
            <div class="earth-glow"></div>
        </div>
    </div>

    <div class="app-container">
        <div id="page-main" class="page active">
            <div class="card">
                <h1>walle</h1>
                <p>Чистота в один клик. <br>Ваш личный ассистент по мусору.</p>
            </div>
            <button class="btn btn-primary" onclick="showPage('page-reg')">Попробовать за 1 ₽</button>
            <button class="btn btn-secondary">Как это работает?</button>
        </div>

        <div id="page-reg" class="page">
            <div class="card">
                <h1>Регистрация</h1>
                <p>Введите ваши данные для начала</p>
                <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" placeholder="Имя" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff;">
                    <input type="tel" placeholder="+7 (999) 000-00-00" style="width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff;">
                </div>
            </div>
            <button class="btn btn-primary" onclick="showPage('page-success')">Продолжить</button>
            <button class="btn btn-secondary" onclick="showPage('page-main')">Назад</button>
        </div>

        <div id="page-success" class="page">
            <div class="card">
                <div class="success-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h1>Готово!</h1>
                <p>Ваша заявка принята. <br>Скоро Walle будет у вас.</p>
            </div>
            <button class="btn btn-primary" onclick="showPage('page-main')">На главную</button>
        </div>
    </div>

    <script>
        // ЛОГИКА ПЕРЕКЛЮЧЕНИЯ СТРАНИЦ
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            // Если это не главная — уменьшаем Землю
            if (pageId !== 'page-main') {
                document.body.classList.add('inner-page');
            } else {
                document.body.classList.remove('inner-page');
            }
            window.scrollTo(0, 0);
        }

        // ГЕНЕРАЦИЯ КОМЕТ
        function createComet() {
            const comet = document.createElement('div');
            comet.className = 'comet';
            document.body.appendChild(comet);

            const startX = Math.random() * window.innerWidth + 200;
            const startY = Math.random() * window.innerHeight - 200;
            
            comet.style.left = startX + 'px';
            comet.style.top = startY + 'px';
            comet.style.width = (Math.random() * 100 + 100) + 'px'; // Длина хвоста
            comet.style.animation = 'cometAnim 1.5s linear forwards';

            setTimeout(() => comet.remove(), 1500);
        }

        setInterval(createComet, 3500);

        // Проверка наличия текстуры
        const testImg = new Image();
        testImg.src = 'earth.jpg';
        testImg.onerror = () => {
            console.warn("Файл earth.jpg не найден. Использую заглушку.");
            document.querySelector('.earth-texture').style.background = '#1a202c';
        };
    </script>
</body>
</html>
